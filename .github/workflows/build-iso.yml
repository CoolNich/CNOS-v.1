name: Build ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap xorriso squashfs-tools ca-certificates
      - name: Build ISO
        run: ./build.sh
      - name: Checksums
        run: sha256sum CNOS-amd64.iso > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: CNOS-iso
          path: |
            CNOS-amd64.iso
            SHA256SUMS
